<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Idioms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e6d7c3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idioms">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="theme.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Idioms</a>
  <label class="switch" title="Đổi giao diện sáng/tối">
    <input type="checkbox" id="themeSwitch" aria-label="Chế độ tối">
    <span class="knob"></span>
  </label>
</header>

<main class="wrap" id="app"><div class="empty">Đang tải dữ liệu...</div></main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const sp = t => `data-speak="${esc(t)}"`;
const sec = (title, html) => html ? `<div class="sec">${title}</div>${html}` : '';

let items = [];

async function init() {
  const app = document.getElementById('app');
  try {
    const r = await fetch('data.json');
    if (!r.ok) throw new Error(r.status);
    const raw = await r.json();
    const entries = Array.isArray(raw) ? raw.map((v, i) => [i, v]) : Object.entries(raw || {});
    items = entries
      .filter(([, v]) => v && v.idiom)
      .map(([k, v]) => ({ ...v, stt: Number(v.stt ?? k) }))
      .sort((a, b) => b.stt - a.stt);               // stt giảm dần
  } catch (e) {
    app.innerHTML = '<div class="empty">Không tải được dữ liệu.<br>Hãy chạy lại workflow "Deploy to GitHub Pages".</div>';
    return;
  }

  // Không có ?no= → mở idiom có stt cao nhất (items đã sắp giảm dần)
  const p = new URLSearchParams(location.search).get('no');
  const idx = p === null ? (items.length ? 0 : -1) : items.findIndex(i => i.stt === Number(p));
  const it = items[idx];
  if (it) document.title = it.idiom + ' · Idioms';

  app.innerHTML = listHtml(idx) + (it ? cardHtml(it) + navHtml(idx) : '');
  bindSearch();
  bindUI();
  if (it) speak(it.idiom);
}

function listHtml(idx) {
  const home = idx < 0;
  return `
    <div class="toprow">
      <button class="pill ${home ? 'active' : ''}" id="listBtn"><span class="pt">☰ Danh sách idioms</span> <span class="count">${items.length}</span></button>
      <button class="pill" id="chBtn"><span class="pt">🏆 Thử tài idioms</span></button>
    </div>
    <div id="listPanel" class="list-panel" ${home ? '' : 'hidden'}>
      <input id="search" type="search" placeholder="Tìm idiom..." autocomplete="off">
      <ul class="idiom-list ${home ? 'full' : ''}">
        ${items.map((i, n) => `<li><a class="${n === idx ? 'cur' : ''}" href="?no=${i.stt}"><span>${esc(i.idiom)}</span></a></li>`).join('')}
      </ul>
    </div>
    <div id="chPanel" class="block cpanel" hidden>
      <div class="seg">
        <button class="pill active" data-m="all"><span class="pt">All</span></button>
        <button class="pill" data-m="custom"><span class="pt">Custom</span></button>
      </div>
      <input id="cin" class="cin" placeholder="Nhập stt, ví dụ: 1, 3-5, 8" autocomplete="off" inputmode="text" hidden>
      <p class="chint" id="chint"></p>
      <button class="btn" id="cgo">Mở khóa câu hỏi</button>
    </div>`;
}

function bindUI() {
  const lp = $('#listPanel'), cp = $('#chPanel'), lb = $('#listBtn'), cb = $('#chBtn');
  const toggle = (panel, btn, other, otherBtn) => {
    const open = panel.hidden;
    panel.hidden = !open; btn.classList.toggle('active', open);
    other.hidden = true; otherBtn.classList.remove('active');
  };
  lb.onclick = () => toggle(lp, lb, cp, cb);
  cb.onclick = () => { toggle(cp, cb, lp, lb); hint(); };

  let mode = 'all';
  const have = new Set(items.map(i => i.stt));
  const selected = () => {
    if (mode === 'all') return { nums: items.map(i => i.stt), bad: [] };
    const r = parseNos($('#cin').value);
    return { nums: r.nums.filter(n => have.has(n)), bad: r.bad.concat(r.nums.filter(n => !have.has(n)).map(String)) };
  };
  function hint() {
    const s = selected();
    $('#chint').textContent = !s.nums.length
      ? (mode === 'all' ? 'Chưa có idiom nào.' : 'Nhập ít nhất 1 stt hợp lệ.')
      : `${s.nums.length} idiom → ${s.nums.length * 2} câu hỏi.` + (s.bad.length ? ` Bỏ qua: ${s.bad.join(', ')}` : '');
  }
  $$('.seg .pill').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    $$('.seg .pill').forEach(x => x.classList.toggle('active', x === b));
    $('#cin').hidden = mode !== 'custom';
    if (mode === 'custom') $('#cin').focus();
    hint();
  });
  $('#cin').oninput = hint;
  $('#cin').onkeydown = e => { if (e.key === 'Enter') $('#cgo').click(); };
  $('#cgo').onclick = () => {
    if (!selected().nums.length) { hint(); return; }
    location.href = 'exam.html?ids=' + encodeURIComponent(mode === 'all' ? 'all' : $('#cin').value.trim());
  };
}

function bindSearch() {
  const q = document.getElementById('search');
  q.addEventListener('input', () => {
    const k = q.value.trim().toLowerCase();
    document.querySelectorAll('.idiom-list li').forEach(li => {
      li.style.display = li.textContent.toLowerCase().includes(k) ? '' : 'none';
    });
  });
}

const exItem = e => !e ? '' : `
  <div class="item" ${sp(e.en)}>
    <div class="en">${esc(e.en)}</div>
    ${e.ipa_us ? `<div class="ipa-sub">${esc(e.ipa_us)}</div>` : ''}
    <div class="vi">${esc(e.vn)}</div>
  </div>`;

function ytHtml(it) {
  const q = encodeURIComponent('idioms ' + it.idiom).replace(/%20/g, '+');
  return `
    <a class="yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" aria-label="Tìm trên YouTube" title="Tìm trên YouTube">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <path fill="#ff0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8z"/>
        <path fill="#fff" d="M9.6 15.6V8.4l6.2 3.6z"/>
      </svg>
    </a>`;
}

function cardHtml(it) {
  const a = it.analyzer || {};
  const alts = (it.alternatives || '').split(',').map(s => s.trim()).filter(Boolean);
  const kv = (label, v, cls = '') => v ? `<div class="kv ${cls}"><b>${label}</b><p>${nl(v)}</p></div>` : '';

  // Thứ tự: tok_list → lit_mean → metaphorical → meaning_vi (nổi bật) → motiv_why
  const analyzer =
    (a.tok_list?.length ? `<div class="toks">${a.tok_list.map(t =>
        `<button class="tok" ${sp(t.word)}><b>${esc(t.word)}</b><span>${esc(t.meaning)}</span></button>`).join('')}</div>` : '')
    + kv('Nghĩa đen', a.lit_mean)
    + kv('Nghĩa bóng', a.metaphorical)
    + kv('Ý nghĩa', it.meaning_vi, 'hl')
    + kv('Vì sao có nghĩa này', a.motiv_why);

  const notes = [
    it.us_uk_freq ? `<div class="note"><b>Anh – Mỹ:</b> ${esc(it.us_uk_freq)}</div>` : '',
    it.special_note ? `<div class="note"><b>Lưu ý:</b> ${esc(it.special_note)}</div>` : ''
  ].join('');

  return `
    <div class="hero" ${sp(it.idiom)}>
      <div class="meta">
        <span class="tag">#${it.stt}</span>
        ${it.formality_level ? `<span class="tag">${esc(it.formality_level)}</span>` : ''}
        ${it.date ? `<span class="tag">${esc(it.date)}</span>` : ''}
      </div>
      <h1 class="big">${esc(it.idiom)}</h1>
      ${it.ipa_us ? `<div class="ipa-row"><span class="tag">US</span><span class="ipa">${esc(it.ipa_us)}</span></div>` : ''}
      ${it.ipa_uk ? `<div class="ipa-row"><span class="tag">UK</span><span class="ipa">${esc(it.ipa_uk)}</span></div>` : ''}
    </div>

    ${sec('🧩 Phân tích', analyzer ? `<div class="block">${analyzer}</div>` : '')}
    ${sec('🇺🇸 Idiom dùng ở Mỹ', (it.us_idiom || []).map(exItem).join(''))}
    ${sec('📌 Cách dùng', (it.usageList || []).map(u =>
        `<div class="block"><p class="usage-text">${esc(u.usage)}</p>${exItem(u.example)}</div>`).join(''))}
    ${sec('📝 Ghi chú', notes)}
    ${sec('🔁 Cách nói khác', alts.length ? `<div class="chips">${alts.map(x => `<button class="chip" ${sp(x)}>${esc(x)}</button>`).join('')}</div>` : '')}
    ${sec('⚡ Ví dụ' + ytHtml(it), (it.example || []).map(exItem).join(''))}

    <a class="btn" href="practice.html?no=${it.stt}">Practice</a>`;
}

function navHtml(idx) {
  const prev = items[idx - 1], next = items[idx + 1];
  return `
    <nav class="nav-control" aria-label="Chuyển idiom">
      <a class="nav-btn ${prev ? '' : 'off'}" ${prev ? `href="?no=${prev.stt}"` : ''} aria-label="Idiom trước">←</a>
      <span class="pos"><b>${idx + 1}</b> / ${items.length}</span>
      <a class="nav-btn ${next ? '' : 'off'}" ${next ? `href="?no=${next.stt}"` : ''} aria-label="Idiom sau">→</a>
    </nav>`;
}

init();
</script>
</body>
</html>
