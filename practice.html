<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Practice · Idioms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e6d7c3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idioms">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="theme.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Idioms</a>
  <label class="switch" title="Đổi giao diện sáng/tối">
    <input type="checkbox" id="themeSwitch" aria-label="Chế độ tối">
    <span class="knob"></span>
  </label>
</header>

<main class="wrap">
  <div class="hero" style="cursor:default">
    <div class="meta"><span class="tag">Practice</span></div>
    <h1 class="big" id="title">...</h1>
  </div>

  <div id="info"></div>

  <a class="btn" id="start" href="#" style="display:none">Làm bài tập</a>
  <a class="btn" id="back" href="index.html" style="margin-top:14px">Quay lại idiom</a>
</main>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const no = Number(new URLSearchParams(location.search).get('no'));
document.getElementById('back').href = 'index.html?no=' + no;

fetch('data.json').then(r => r.json()).then(raw => {
  const list = (Array.isArray(raw) ? raw.map((v, i) => v && { ...v, stt: v.stt ?? i })
                                    : Object.entries(raw).map(([k, v]) => v && { ...v, stt: v.stt ?? k })).filter(Boolean);
  const it = list.find(v => Number(v.stt) === no);
  document.getElementById('title').textContent = it ? it.idiom : 'Không tìm thấy idiom';
  const p = it && it.practice;
  const info = document.getElementById('info');
  if (!p || !p.exam || !p.exam.length) {
    info.innerHTML = '<div class="block">Idiom này chưa có bài tập.</div>';
    return;
  }
  const labels = { idiom_main: 'Idiom chính', idiom_1d: 'Ôn lại (1 ngày)', idiom_7d: 'Ôn lại (7 ngày)', idiom_21d: 'Ôn lại (21 ngày)', idiom_30d: 'Ôn lại (30 ngày)' };
  info.innerHTML = '<div class="sec">📚 Các idiom trong bài</div>' + Object.keys(labels).filter(k => p[k])
    .map(k => `<div class="block"><span class="tag">${labels[k]}</span><div style="margin-top:8px;font-weight:700;font-size:20px">${esc(p[k])}</div></div>`).join('');
  const s = document.getElementById('start');
  s.href = 'exam.html?no=' + no;
  s.style.display = 'block';
}).catch(() => {
  document.getElementById('title').textContent = 'Không tải được dữ liệu';
});
</script>
</body>
</html>
